name: Android CI

on:
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK (Kotlin Android apps typically use JDK 17 or 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up builds

      # 3. Grant execute permissions to the Gradle wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Run Kotlin linting and unit tests
      - name: Run Tests and Linting
        run: ./gradlew test

      # 5. Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Save and upload the compiled APK as a GitHub artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
